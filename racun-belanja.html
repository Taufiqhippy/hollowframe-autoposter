<html lang="id">
<head>

  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --accent: #f97316;
      --yellow: #facc15;
      --text: #f8fafc;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      padding: 24px 16px 60px;
    }
    .container { max-width: 560px; margin: 0 auto; }
    .header { text-align: center; margin-bottom: 22px; }
    .badge {
      display: inline-block;
      background: var(--yellow);
      color: #0f172a;
      font-weight: 900;
      font-size: 12px;
      padding: 4px 14px;
      border-radius: 999px;
      letter-spacing: 1px;
      margin-bottom: 10px;
    }
    .header h1 { font-size: 26px; font-weight: 900; }
    .header p { color: var(--muted); font-size: 14px; margin-top: 6px; }
    .support-banner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: linear-gradient(135deg, #7c3aed, #db2777);
      color: #fff;
      text-decoration: none;
      padding: 14px 18px;
      border-radius: 16px;
      font-weight: 800;
      font-size: 14px;
      margin-bottom: 18px;
      box-shadow: 0 8px 20px rgba(219, 39, 119, 0.3);
    }
    .support-banner span.btn {
      background: #fff;
      color: #0f172a;
      padding: 6px 12px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 900;
      white-space: nowrap;
    }
    .search-box { margin-bottom: 14px; }
    .search-box input {
      width: 100%;
      padding: 15px 18px;
      border-radius: 16px;
      border: 2px solid #334155;
      background: var(--card);
      color: var(--text);
      font-size: 15px;
      font-weight: 600;
      outline: none;
    }
    .search-box input:focus { border-color: var(--accent); }
    .cats {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 10px;
      margin-bottom: 14px;
    }
    .cat-btn {
      background: var(--card);
      color: var(--muted);
      border: 1px solid #334155;
      padding: 8px 14px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }
    .cat-btn.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }
    .product-list { display: flex; flex-direction: column; gap: 12px; }
    .product-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: var(--card);
      border: 1px solid #334155;
      border-radius: 18px;
      padding: 12px 14px;
      text-decoration: none;
      color: var(--text);
      transition: transform 0.15s ease, border-color 0.15s ease;
    }
    .product-card:hover { transform: translateY(-2px); border-color: var(--accent); }
    .thumb-wrap {
      position: relative;
      width: 68px;
      height: 68px;
      border-radius: 14px;
      overflow: hidden;
      flex-shrink: 0;
      background: #0f172a;
      border: 2px solid var(--yellow);
    }
    .thumb-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .num-tag {
      position: absolute;
      top: 0;
      left: 0;
      background: var(--yellow);
      color: #0f172a;
      font-weight: 900;
      font-size: 11px;
      padding: 2px 6px;
      border-bottom-right-radius: 8px;
    }
    .prod-info { flex: 1; }
    .prod-cat { font-size: 11px; color: var(--yellow); font-weight: 800; text-transform: uppercase; }
    .prod-title { font-size: 14px; font-weight: 800; margin-top: 2px; line-height: 1.3; }
    .prod-meta { font-size: 12px; color: var(--muted); margin-top: 4px; font-weight: 700; }
    .buy-btn {
      background: var(--accent);
      color: #fff;
      font-weight: 900;
      font-size: 13px;
      padding: 10px 14px;
      border-radius: 12px;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .empty { text-align: center; color: var(--muted); padding: 32px 0; font-size: 14px; }
  </style>
</head>

        url: "https://s.shopee.co.id/2BGePImUGp"
      }

    let activeCat = "ALL";
    const searchInput = document.getElementById("searchInput");
    const productList = document.getElementById("productList");
    const catBtns = document.querySelectorAll(".cat-btn");

    function render() {
      const q = searchInput.value.trim().toLowerCase();
      const filtered = PRODUCTS.filter(p => {
        const matchCat = activeCat === "ALL" || p.category === activeCat;
        const matchQ = !q || p.code.toLowerCase().includes(q) || p.title.toLowerCase().includes(q) || p.category.toLowerCase().includes(q);
        return matchCat && matchQ;
      });

      if (!filtered.length) {
        productList.innerHTML = '<div class="empty">Produk belum ditemukan. Coba ketik nomor lain (misal: 01, 02, Kipas, Rak).</div>';
        return;
      }

      productList.innerHTML = filtered.map(p => `
        <a class="product-card" href="${p.url}" target="_blank" rel="noopener">
          <div class="thumb-wrap">
            <span class="num-tag">${p.code}</span>
            <img src="${p.img}" alt="${p.code}" loading="lazy" />
          </div>
          <div class="prod-info">
            <div class="prod-cat">${p.category}</div>
            <div class="prod-title">${p.title}</div>
            <div class="prod-meta">${p.meta}</div>
          </div>
          <div class="buy-btn">Beli →</div>
        </a>
      `).join("");
    }

    searchInput.addEventListener("input", render);
    catBtns.forEach(btn => {
      btn.addEventListener("click", () => {
        catBtns.forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        activeCat = btn.dataset.cat;
        render();
      });
    });

    render();
  </script>
