<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Kantor Ai - Bebas Kreasi (3D Interaktif)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%; overflow: hidden;
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      background: #dce8f5; color: #0f172a;
      user-select: none;
    }
    #canvas-wrap { position: fixed; inset: 0; }
    canvas { display: block; width: 100%; height: 100%; }

    /* Top HUD - Light Glass Aesthetic */
    .hud-top {
      position: fixed; top: 12px; left: 12px; right: 12px;
      display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
      gap: 10px; pointer-events: none; z-index: 20;
    }
    .hud-card {
      pointer-events: auto;
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(15, 23, 42, 0.1);
      border-radius: 14px;
      padding: 9px 14px;
      box-shadow: 0 8px 26px rgba(15, 23, 42, 0.12);
    }
    .brand-row { display: flex; align-items: center; gap: 10px; }
    .brand-icon {
      width: 36px; height: 36px; border-radius: 10px;
      background: linear-gradient(135deg, #0ea5e9, #8b5cf6);
      display: grid; place-items: center; font-size: 18px; color: #fff;
    }
    .brand-row h1 { font-size: 0.95rem; font-weight: 800; color: #0f172a; letter-spacing: -0.02em; }
    .brand-row p { font-size: 0.72rem; color: #475569; }

    .top-actions { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
    .btn {
      pointer-events: auto;
      display: inline-flex; align-items: center; gap: 5px;
      background: rgba(255, 255, 255, 0.92); color: #1e293b;
      border: 1px solid rgba(15, 23, 42, 0.14);
      border-radius: 10px; padding: 7px 11px;
      font-size: 0.75rem; font-weight: 700; text-decoration: none;
      cursor: pointer; font-family: inherit; transition: all 0.18s;
      box-shadow: 0 3px 10px rgba(15, 23, 42, 0.06);
    }
    .btn:hover { border-color: #0ea5e9; background: #e0f2fe; color: #0369a1; }
    .btn-primary { background: linear-gradient(135deg, #0ea5e9, #6366f1); color: #fff; border: none; }
    .btn-primary:hover { opacity: 0.93; color: #fff; }
    .btn-sholat { background: #ecfdf5; border-color: #10b981; color: #047857; }
    .btn-sholat.active { background: #10b981; color: #fff; }
    .btn-sleep { background: #eef2ff; border-color: #6366f1; color: #4338ca; }
    .btn-sleep.active { background: #4f46e5; color: #fff; }

    .prayer-pill {
      pointer-events: auto;
      display: inline-flex; align-items: center; gap: 7px;
      font-size: 0.74rem; font-weight: 700; color: #065f46;
      background: rgba(236, 253, 245, 0.94); border: 1px solid rgba(16, 185, 129, 0.35);
      padding: 6px 11px; border-radius: 999px;
      box-shadow: 0 3px 10px rgba(15, 23, 42, 0.06);
    }

    /* Camera Bar */
    .cam-bar {
      position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%);
      display: flex; gap: 6px; flex-wrap: nowrap; overflow-x: auto; max-width: calc(100vw - 24px);
      padding: 7px 10px; z-index: 20;
      background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(12px);
      border: 1px solid rgba(15, 23, 42, 0.12); border-radius: 14px;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.14);
    }
    .cam-btn {
      white-space: nowrap; background: #f1f5f9; color: #334155;
      border: 1px solid #e2e8f0; border-radius: 9px;
      padding: 6px 10px; font-size: 0.72rem; font-weight: 700;
      cursor: pointer; font-family: inherit; transition: all 0.15s;
    }
    .cam-btn:hover, .cam-btn.active { background: #0ea5e9; color: #fff; border-color: #0ea5e9; }

    /* Live Activity Feed (Bottom Left) */
    .feed-box {
      position: fixed; bottom: 68px; left: 12px; width: 325px; max-width: calc(100vw - 24px);
      z-index: 18; pointer-events: auto;
    }
    .feed-title {
      font-size: 0.69rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.05em;
      color: #475569; margin-bottom: 6px; display: flex; justify-content: space-between;
    }
    .feed-list { display: grid; gap: 5px; max-height: 124px; overflow-y: auto; }
    .feed-item {
      font-size: 0.73rem; color: #1e293b;
      background: #f8fafc; border-left: 3px solid #0ea5e9;
      padding: 5px 8px; border-radius: 7px;
    }
    .feed-item span { color: #64748b; font-size: 0.67rem; margin-right: 5px; font-weight: 700; }

    /* Inspector Drawer (Right) */
    .inspector {
      position: fixed; top: 76px; right: 12px; width: 315px; max-width: calc(100vw - 24px);
      max-height: calc(100vh - 150px); overflow-y: auto;
      z-index: 22; display: none;
    }
    .inspector.open { display: block; }
    .insp-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; margin-bottom: 10px; }
    .insp-head h3 { font-size: 0.95rem; font-weight: 800; color: #0f172a; }
    .insp-head p { font-size: 0.74rem; color: #475569; }
    .close-btn {
      background: #f1f5f9; border: 1px solid #cbd5e1; color: #334155;
      width: 26px; height: 26px; border-radius: 8px; cursor: pointer; font-weight: 800;
    }
    .insp-body { font-size: 0.79rem; color: #334155; display: grid; gap: 8px; }
    .insp-stat {
      background: #f8fafc; border: 1px solid #e2e8f0;
      border-radius: 10px; padding: 8px 10px;
    }
    .insp-stat small { display: block; font-size: 0.67rem; color: #64748b; text-transform: uppercase; font-weight: 800; }
    .insp-stat strong { font-size: 0.83rem; color: #0f172a; }

    /* Floating 3D HTML Labels (compact employee name tags only) */
    #labels-layer { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 10; }
    .emp-tag-3d {
      position: absolute; transform: translate(-50%, -100%);
      background: rgba(15, 23, 42, 0.72);
      border: 1px solid rgba(255, 255, 255, 0.28);
      padding: 1.5px 6px; border-radius: 999px;
      font-size: 0.58rem; font-weight: 700; color: #f8fafc;
      white-space: nowrap; box-shadow: 0 2px 6px rgba(15, 23, 42, 0.18);
    }
    #labels-layer.hide-tags .emp-tag-3d { display: none !important; }
    .nadia-speech {
      position: absolute; transform: translate(-50%, -100%);
      background: #ffffff; color: #0f172a;
      border: 2px solid #0ea5e9; border-radius: 14px;
      padding: 6px 12px; font-size: 0.72rem; font-weight: 800;
      white-space: nowrap; box-shadow: 0 8px 22px rgba(14, 165, 233, 0.28);
      opacity: 0; pointer-events: none; transition: opacity 0.28s ease;
      z-index: 16;
    }
    .nadia-speech::after {
      content: ""; position: absolute; left: 50%; bottom: -8px; transform: translateX(-50%);
      border-width: 8px 7px 0 7px; border-style: solid;
      border-color: #0ea5e9 transparent transparent transparent;
    }
    .nadia-speech.show { opacity: 1; }
    @media (max-width: 720px) {
      .feed-box { display: none; }
    }
  </style>
</head>
<body>
  <div id="canvas-wrap"></div>
  <div id="labels-layer"></div>

  <div class="hud-top">
    <div class="hud-card brand-row">
      <div class="brand-icon">🏢</div>
      <div>
        <h1>Kantor Ai - Bebas Kreasi (3D)</h1>
        <p id="syncStatus">Memuat data live studio...</p>
      </div>
    </div>
    <div class="top-actions">
      <span class="prayer-pill" id="prayerClock">🕌 Gorontalo WITA: --:--</span>
      <button class="btn" id="btnHardRefresh" title="Muat ulang versi terbaru tanpa cache">🔄 Refresh</button>
      <button class="btn" id="btnToggleTags">🏷️ Sembunyikan Nama</button>
      <a class="btn btn-primary" href="office.html">📋 Dashboard 2D</a>
      <button class="btn" id="btnResetCam">🎥 Reset</button>
    </div>
  </div>

  <div class="hud-card feed-box">
    <div class="feed-title"><span>⚡ Aktivitas Karyawan Live</span><span style="color:#0284c7;">Kantor 3D</span></div>
    <div class="feed-list" id="feedList"></div>
  </div>

  <div class="hud-card inspector" id="inspector">
    <div class="insp-head">
      <div>
        <h3 id="inspTitle">Ruangan</h3>
        <p id="inspSub">Detail Divisi</p>
      </div>
      <button class="close-btn" id="inspClose">✕</button>
    </div>
    <div class="insp-body" id="inspBody"></div>
  </div>

  <div class="cam-bar">
    <button class="cam-btn active" data-cam="overview">🏢 Overview</button>
    <button class="cam-btn" data-cam="assistant">🧠 Asisten</button>
    <button class="cam-btn" data-cam="tts_studio">🎙️ TTS</button>
    <button class="cam-btn" data-cam="creative">💡 Tim Kreatif</button>
    <button class="cam-btn" data-cam="copywriter">✍️ Caption</button>
    <button class="cam-btn" data-cam="threads">🧵 Threads</button>
    <button class="cam-btn" data-cam="deadframe">🎬 DeadFrame</button>
    <button class="cam-btn" data-cam="hollowframe">👻 Hollow Frame</button>
    <button class="cam-btn" data-cam="wildlogic">🌿 WildLogic</button>
    <button class="cam-btn" data-cam="racunbelanja">🛍️ Racun Belanja</button>
    <button class="cam-btn" data-cam="designer">🎨 Desain Visual</button>
    <button class="cam-btn" data-cam="musholla">🕌 Musholla</button>
    <button class="cam-btn" data-cam="dorm_m">🛏️ Asrama Putra</button>
    <button class="cam-btn" data-cam="dorm_f">🛏️ Asrama Putri</button>
    <button class="cam-btn" data-cam="gym">🏋️ Gym</button>
    <button class="cam-btn" data-cam="gameroom">🎮 Game</button>
    <button class="cam-btn" data-cam="pantry">🍽️ Makan</button>
    <button class="cam-btn" data-cam="library">📚 Perpustakaan</button>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // --- 1. GORONTALO PRAYER SCHEDULE (WITA / UTC+8) ---
    const GORONTALO_PRAYERS = [
      { name: 'Subuh',   start: 4 * 60 + 22,  end: 4 * 60 + 42,  str: '04:22' },
      { name: 'Dzuhur',  start: 11 * 60 + 46, end: 12 * 60 + 12, str: '11:46' },
      { name: 'Ashar',   start: 15 * 60 + 8,  end: 15 * 60 + 30, str: '15:08' },
      { name: 'Maghrib', start: 17 * 60 + 48, end: 18 * 60 + 10, str: '17:48' },
      { name: 'Isya',    start: 19 * 60 + 1,  end: 19 * 60 + 22, str: '19:01' },
    ];
    let forceSholatMode = false;
    let forceSleepMode = false;

    function getGorontaloTime() {
      const now = new Date();
      const utcMs = now.getTime() + now.getTimezoneOffset() * 60000;
      const wita = new Date(utcMs + 8 * 3600000);
      const mins = wita.getHours() * 60 + wita.getMinutes();
      const hhmm = String(wita.getHours()).padStart(2, '0') + ':' + String(wita.getMinutes()).padStart(2, '0');
      const isSleep = (mins >= 23 * 60 + 45) || (mins < 4 * 60 + 22);
      let activePrayer = null;
      let nextPrayer = GORONTALO_PRAYERS[0];
      for (const p of GORONTALO_PRAYERS) {
        if (mins >= p.start && mins <= p.end) { activePrayer = p; break; }
        if (mins < p.start) { nextPrayer = p; break; }
      }
      return { hhmm, isSleep, activePrayer, nextPrayer };
    }

    // --- 2. ROOM LAYOUT (3 Wings: 5 Top Work Rooms, 5 Middle Work Rooms, 7 Bottom Lifestyle/Dorm Rooms!) ---
    const WORK_ROOMS = [
      // Row 1 (z = -9.5, 5 rooms across x = -16, -8, 0, +8, +16)
      { id: 'assistant',   roomLabel: '🧠 Ruang Asisten',     tag: 'Nadia-Asisten AI',       gender: 'F', hijab: 0xbae6fd, shirt: 0x38bdf8, bottom: 0x334155, hair: 0x292524, x: -16, z: -9.5, doorZ: -5.5, accent: 0x0ea5e9, rug: 0xe0f2fe, tumbler: 0xec4899 },
      { id: 'tts_studio',  roomLabel: '🎙️ Ruang Studio TTS',  tag: 'Reno-Studio TTS',        gender: 'M', hijab: null,     shirt: 0x8b5cf6, bottom: 0x1e293b, hair: 0x18181b, x: -8,  z: -9.5, doorZ: -5.5, accent: 0x9333ea, rug: 0xf3e8ff, tumbler: 0x22d3ee, isTTS: true },
      { id: 'creative',    roomLabel: '💡 Ruang Tim Kreatif', tag: 'Arga-Tim Kreatif',       gender: 'M', hijab: null,     shirt: 0xfb7185, bottom: 0x475569, hair: 0x1e1b4b, x: 0,   z: -9.5, doorZ: -5.5, accent: 0xe11d48, rug: 0xffe4e6, tumbler: 0xfacc15, isCreative: true },
      { id: 'copywriter',  roomLabel: '✍️ Ruang Caption & SEO',tag: 'Sora-Caption & SEO',     gender: 'F', hijab: null,     shirt: 0x14b8a6, bottom: 0x475569, hair: 0x451a03, x: 8,   z: -9.5, doorZ: -5.5, accent: 0x0d9488, rug: 0xccfbf1, tumbler: 0xf59e0b },
      { id: 'threads',     roomLabel: '🧵 Ruang Threads',     tag: 'Lina-Threads',           gender: 'F', hijab: null,     shirt: 0x06b6d4, bottom: 0xf1f5f9, hair: 0x1c1917, x: 16,  z: -9.5, doorZ: -5.5, accent: 0x0891b2, rug: 0xcffafe, tumbler: 0xa855f7 },
      // Row 2 (z = -0.5, 5 rooms across x = -16, -8, 0, +8, +16)
      { id: 'deadframe',   roomLabel: '🎬 Ruang DeadFrame',   tag: 'Raka-YT DeadFrame',      gender: 'M', hijab: null,     shirt: 0xef4444, bottom: 0x1e293b, hair: 0x0f172a, x: -16, z: -0.5, doorZ: 3.3,  accent: 0xdc2626, rug: 0xfee2e2, tumbler: 0x3b82f6 },
      { id: 'hollowframe', roomLabel: '👻 Ruang Hollow Frame',tag: 'Dina-YT Hollow Frame',   gender: 'F', hijab: 0xfef3c7, shirt: 0xf97316, bottom: 0x44403c, hair: 0x1c1917, x: -8,  z: -0.5, doorZ: 3.3,  accent: 0xea580c, rug: 0xffedd5, tumbler: 0x10b981 },
      { id: 'wildlogic',   roomLabel: '🌿 Ruang WildLogic',   tag: 'Bima-YT WildLogic',      gender: 'M', hijab: null,     shirt: 0x22c55e, bottom: 0x78716c, hair: 0x27272a, x: 0,   z: -0.5, doorZ: 3.3,  accent: 0x16a34a, rug: 0xdcfce7, tumbler: 0xf97316 },
      { id: 'racunbelanja',roomLabel: '🛍️ Ruang Racun Belanja',tag: 'Fajar-Racun Belanja',   gender: 'M', hijab: null,     shirt: 0xeab308, bottom: 0x1e3a8a, hair: 0x171717, x: 8,   z: -0.5, doorZ: 3.3,  accent: 0xca8a04, rug: 0xfef9c3, tumbler: 0xef4444 },
      { id: 'designer',    roomLabel: '🎨 Ruang Desain Visual',tag: 'Tia-Desain Visual',     gender: 'F', hijab: 0xe9d5ff, shirt: 0xd946ef, bottom: 0x334155, hair: 0x1e1b4b, x: 16,  z: -0.5, doorZ: 3.3,  accent: 0xc026d3, rug: 0xfaf5ff, tumbler: 0x38bdf8, isDesigner: true },
    ];

    const LIFESTYLE_ROOMS = [
      // Row 3 (z = +9.0, 7 Rooms: Asrama Putra + 5 Lifestyle/Musholla + Asrama Putri)
      { id: 'dorm_m',   roomLabel: '🛏️ Asrama Putra',          x: -18.6, z: 9.0, w: 5.8, accent: 0x3b82f6, rug: 0xdbeafe, doorZ: 5.2 },
      { id: 'musholla', roomLabel: '🕌 Musholla (Gorontalo)',  x: -12.4, z: 9.0, w: 5.8, accent: 0x10b981, rug: 0xd1fae5, doorZ: 5.2 },
      { id: 'gym',      roomLabel: '🏋️ Ruang Gym',             x: -6.2,  z: 9.0, w: 5.8, accent: 0xf43f5e, rug: 0xffe4e6, doorZ: 5.2 },
      { id: 'gameroom', roomLabel: '🎮 Ruang Game Console',    x: 0.0,   z: 9.0, w: 5.8, accent: 0x6366f1, rug: 0xe0e7ff, doorZ: 5.2 },
      { id: 'pantry',   roomLabel: '🍽️ Ruang Makan & Kopi',    x: 6.2,   z: 9.0, w: 5.8, accent: 0xf59e0b, rug: 0xfef3c7, doorZ: 5.2 },
      { id: 'library',  roomLabel: '📚 Perpustakaan',          x: 12.4,  z: 9.0, w: 5.8, accent: 0x0d9488, rug: 0xccfbf1, doorZ: 5.2 },
      { id: 'dorm_f',   roomLabel: '🛏️ Asrama Putri',          x: 18.6,  z: 9.0, w: 5.8, accent: 0xec4899, rug: 0xfce7f3, doorZ: 5.2 },
    ];

    const ALL_ROOMS = Object.fromEntries([...WORK_ROOMS, ...LIFESTYLE_ROOMS].map(r => [r.id, r]));

    // --- 3. BRIGHT DAYLIGHT SCENE, CAMERA, RENDERER ---
    const wrap = document.getElementById('canvas-wrap');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xdbeafe);
    scene.fog = new THREE.FogExp2(0xdbeafe, 0.008);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 160);
    camera.position.set(0, 24, 28);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    wrap.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.maxPolarAngle = Math.PI / 2.15;
    controls.minDistance = 6;
    controls.maxDistance = 52;
    controls.target.set(0, 0.6, 0.5);

    let camLerp = null;
    function flyTo(pos, target) {
      camLerp = { pos: new THREE.Vector3(...pos), target: new THREE.Vector3(...target), t: 0 };
    }

    // Warm Daylight Lighting
    scene.add(new THREE.HemisphereLight(0xffffff, 0xe2e8f0, 1.15));
    const sun = new THREE.DirectionalLight(0xfffbeb, 1.15);
    sun.position.set(18, 30, 20);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    sun.shadow.camera.left = -28; sun.shadow.camera.right = 28;
    sun.shadow.camera.top = 24; sun.shadow.camera.bottom = -24;
    scene.add(sun);

    // --- 4. ARCHITECTURAL FLOOR & WHITE WALLS ---
    const floorBase = new THREE.Mesh(
      new THREE.BoxGeometry(45.5, 0.4, 27.5),
      new THREE.MeshStandardMaterial({ color: 0xf5efe6, roughness: 0.72 }) // Warm Light Oak/Cream
    );
    floorBase.position.set(0, -0.2, 0.2);
    floorBase.receiveShadow = true;
    scene.add(floorBase);

    // Two Bright Corridors (z = -5.0 and z = +4.4)
    const hallMat = new THREE.MeshStandardMaterial({ color: 0xe2e8f0, roughness: 0.8 });
    [-5.0, 4.4].forEach(cz => {
      const h = new THREE.Mesh(new THREE.BoxGeometry(43.5, 0.04, 2.8), hallMat);
      h.position.set(0, 0.02, cz);
      h.receiveShadow = true;
      scene.add(h);
    });

    // Shared Materials
    const whiteWallMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.55 });
    const glassMat = new THREE.MeshPhysicalMaterial({ color: 0xbae6fd, transparent: true, opacity: 0.22, roughness: 0.1 });
    const trimMetal = new THREE.MeshStandardMaterial({ color: 0xcbd5e1, metalness: 0.35, roughness: 0.35 });
    const oakDeskMat = new THREE.MeshStandardMaterial({ color: 0xd6a77a, roughness: 0.55 });
    const whiteCabMat = new THREE.MeshStandardMaterial({ color: 0xf8fafc, roughness: 0.5 });
    const darkScreenMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.4 });

    const clickableObjects = [];
    const labelsLayer = document.getElementById('labels-layer');
    const roomLabels = [];

    function addPlant(parent, x, z) {
      const g = new THREE.Group();
      const pot = new THREE.Mesh(new THREE.CylinderGeometry(0.24, 0.18, 0.4, 10), new THREE.MeshStandardMaterial({ color: 0xfef3c7, roughness: 0.6 }));
      pot.position.y = 0.2; pot.castShadow = true;
      const leaves = new THREE.Mesh(new THREE.DodecahedronGeometry(0.36, 0), new THREE.MeshStandardMaterial({ color: 0x22c55e, roughness: 0.75 }));
      leaves.position.y = 0.64; leaves.castShadow = true;
      g.add(pot, leaves);
      g.position.set(x, 0, z);
      parent.add(g);
    }

    function createWallSign(text, accentHex, width = 3.2) {
      const cvs = document.createElement('canvas');
      cvs.width = 512; cvs.height = 104;
      const ctx = cvs.getContext('2d');
      const hex = '#' + accentHex.toString(16).padStart(6, '0');

      // Clean white architectural wall plaque with colored left accent bar
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, 512, 104);
      ctx.fillStyle = hex;
      ctx.fillRect(0, 0, 22, 104);
      ctx.strokeStyle = '#cbd5e1';
      ctx.lineWidth = 6;
      ctx.strokeRect(3, 3, 506, 98);

      // Crisp dark room title
      ctx.fillStyle = '#0f172a';
      ctx.font = '800 34px "Plus Jakarta Sans", system-ui, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(text, 266, 54);

      const tex = new THREE.CanvasTexture(cvs);
      tex.colorSpace = THREE.SRGBColorSpace;

    const feedList = document.getElementById('feedList');
    function pushFeed(text, colorHex) {
      const hhmm = getGorontaloTime().hhmm;
      const div = document.createElement('div');
      div.className = 'feed-item';
      div.style.borderLeftColor = '#' + colorHex.toString(16).padStart(6, '0');
      div.innerHTML = `<span>${hhmm}</span>${text}`;
      feedList.prepend(div);
      while (feedList.children.length > 6) feedList.lastChild.remove();
    }

    function buildPath(fromRoom, toRoom, destPos) {
      const midZ = (fromRoom.z < -4 && toRoom.z < -4) ? -5.0 : 4.4;
      const fromDoor = new THREE.Vector3(fromRoom.x + 0.2, 0, fromRoom.doorZ);
      const hallA = new THREE.Vector3(fromRoom.x + 0.2, 0, midZ + (Math.random() - 0.5) * 0.7);
      const hallB = new THREE.Vector3(toRoom.x, 0, hallA.z);
      const toDoor = new THREE.Vector3(toRoom.x, 0, toRoom.doorZ);
      return [fromDoor, hallA, hallB, toDoor, destPos];
    }

    function sendEmployee(empId, targetRoomId, destPos, activityType, logText, propColor = null, duration = 6.5) {
      const emp = employees[empId];
      const toRoom = ALL_ROOMS[targetRoomId];
      if (!emp || !toRoom) return false;
      const fromRoom = emp.spec;
      emp.waypoints = buildPath(fromRoom, toRoom, destPos);
      emp.returnWaypoints = [...emp.waypoints].reverse().slice(1).concat([emp.seatPos.clone()]);
      emp.wpIdx = 0;
      emp.goingBack = false;
      emp.state = 'walking';
      emp.activityType = activityType;
      emp.activityText = logText;
      emp.timer = duration;
      if (propColor) {
        emp.prop.material.color.setHex(propColor);
        emp.prop.material.emissive.setHex(propColor);
        emp.prop.visible = true;
      } else {
        emp.prop.visible = false;
      }
      pushFeed(logText, propColor || toRoom.accent);
      return true;
    }

    let stepTick = 0;
    function scheduleBehavior() {
      const { activePrayer, isSleep } = getGorontaloTime();
      if (activePrayer || forceSholatMode || isSleep || forceSleepMode) return; // Sholat & Sleep take priority!

      stepTick++;
      // Alternate between Work Handoffs & Realistic Lifestyle Breaks (Gym, Game Co-op, Makan, Perpustakaan)
      if (stepTick % 2 === 1) {
        const m = WORK_HANDOFFS[(Math.floor(stepTick / 2)) % WORK_HANDOFFS.length];
        if (employees[m.from]?.state === 'working') {
          const tr = ALL_ROOMS[m.to];
          sendEmployee(m.from, m.to, new THREE.Vector3(tr.x + 1.15, 0, tr.z + 0.9), 'deliver', m.msg, m.color, 2.2);
          // Nadia briefly pops a short instruction bubble above her head!
          if (m.from !== 'assistant' && m.to !== 'assistant') {
            nadiaSay(m.msg.replace(/^[^\w]+/, '').slice(0, 42) + '!', 4200);
          }
        }
      } else {
        const idleIds = Object.keys(employees).filter(id => employees[id].state === 'working');
        if (!idleIds.length) return;
        const pick = idleIds[Math.floor(Math.random() * idleIds.length)];
        const freeSeat = (actType) => {
          const used = Object.values(employees)
            .filter(e => e.state !== 'working' && e.activityType === actType)
            .map(e => e.seatSlot);
          if (!used.includes(0)) return 0;
          if (!used.includes(1)) return 1;
          return -1; // Full (max 2)
        };
        const choice = Math.floor(Math.random() * 4);
        if (choice === 0) {
          // Gym (max 2: treadmill kiri & matras kanan, anti-numpuk)
          const slot = freeSeat('gym');
          if (slot !== -1) {
            const r = ALL_ROOMS.gym;
            employees[pick].seatSlot = slot;
            const dx = slot === 0 ? -1.3 : 1.2;
            sendEmployee(pick, 'gym', new THREE.Vector3(r.x + dx, 0, r.z + 0.5), 'gym', `${employees[pick].spec.tag} olahraga di Ruang Gym`, null, 8);
          }
        } else if (choice === 1) {
          // Game Console: STRICT MAX 2 orang, duduk bersebelahan rapi di sofa (kiri -0.85 & kanan +0.85)
          const s0 = freeSeat('game');
          if (s0 !== -1) {
            const r = ALL_ROOMS.gameroom;
            employees[pick].seatSlot = s0;
            sendEmployee(pick, 'gameroom', new THREE.Vector3(r.x + (s0 === 0 ? -0.85 : 0.85), 0, r.z - 0.35), 'game', `${employees[pick].spec.tag} main Game Console`, null, 9);
            const s1 = freeSeat('game');
            const friend = idleIds.find(id => id !== pick);
            if (s1 !== -1 && friend) {
              employees[friend].seatSlot = s1;
              sendEmployee(friend, 'gameroom', new THREE.Vector3(r.x + (s1 === 0 ? -0.85 : 0.85), 0, r.z - 0.35), 'game', `${employees[friend].spec.tag} mabar Game Console bareng!`, null, 9);
            }
          }
        } else if (choice === 2) {
          // Makan / Ngopi (max 2 kursi bersebelahan)
          const slot = freeSeat('eat');
          if (slot !== -1) {
            const r = ALL_ROOMS.pantry;
            employees[pick].seatSlot = slot;
            const dx = slot === 0 ? -0.65 : 0.65;
            sendEmployee(pick, 'pantry', new THREE.Vector3(r.x + dx, 0, r.z - 0.9), 'eat', `${employees[pick].spec.tag} istirahat makan & ngopi`, null, 8);
          }
        } else {
          // Perpustakaan (max 2 kursi bersebelahan)

          if (slot !== -1) {
            const r = ALL_ROOMS.library;
            employees[pick].seatSlot = slot;

          }
        }
      }
    }

      // Exact math: root.rotation.y = Math.PI + bodyPivot.rotation.x = -Math.PI/2

      const bunkOffsets = [

          null, 600

      });

    async function pollNadiaBroadcast() {
      try {
        const tok = (localStorage.getItem('kantor_ai_bos_token') || '').trim();

        if (tok) {
          const r = await fetch('https://api.github.com/repos/Taufiqhippy/hollowframe-autoposter/contents/nadia-chat.json?ref=main&t=' + Date.now(), {
            headers: { Authorization: 'Bearer ' + tok, Accept: 'application/vnd.github+json' }
          });
          if (r.ok) {
            const j = await r.json();
            const bytes = Uint8Array.from(atob(j.content.replace(/\n/g, '')), c => c.charCodeAt(0));
            data = JSON.parse(new TextDecoder('utf-8').decode(bytes));
          }
        }
        if (!data) {
          const r2 = await fetch('nadia-chat.json?t=' + Date.now());
          if (r2.ok) data = await r2.json();
        }
        if (data && data.broadcast && data.broadcast.id !== lastBroadcastId) {
          const isInitial = lastBroadcastId === null;
          lastBroadcastId = data.broadcast.id;
          // Show announcement immediately (and apply action if fresh broadcast!)

    // --- 10. SMOOTH NATURAL ANIMATION LOOP ---
    const clock = new THREE.Clock();
    const projVec = new THREE.Vector3();
    function project(v) {
      projVec.copy(v).project(camera);
      return { x: (projVec.x * 0.5 + 0.5) * window.innerWidth, y: (-projVec.y * 0.5 + 0.5) * window.innerHeight, vis: projVec.z < 1 };
    }

    function lerpAngle(a, b, t) {
      let diff = ((b - a + Math.PI) % (Math.PI * 2)) - Math.PI;
      if (diff < -Math.PI) diff += Math.PI * 2;
      return a + diff * t;
    }

    function animate() {
      requestAnimationFrame(animate);
      const dt = Math.min(clock.getDelta(), 0.05);
      const t = clock.elapsedTime;

      if (camLerp) {
        camLerp.t += dt * 2.2;
        camera.position.lerp(camLerp.pos, 0.08);
        controls.target.lerp(camLerp.target, 0.08);
        if (camLerp.t >= 1.2) camLerp = null;
      }
      controls.update();

      // Animated Game Room TV glow
      if (gameTvScreen) {
        gameTvScreen.material.color.setHSL((t * 0.12) % 1, 0.72, 0.62);
      }

      Object.values(employees).forEach((emp, idx) => {
        // Default smooth reset of bodyPivot/upper tilt
        let targetUpperX = 0;
        let targetBodyY = 0;
        let targetPivotX = 0;

        if (emp.state === 'working') {
          const p = t * 6.5 + idx * 1.5;
          emp.leftArm.rotation.x = THREE.MathUtils.lerp(emp.leftArm.rotation.x, -1.0 + Math.sin(p) * 0.14, 0.2);
          emp.rightArm.rotation.x = THREE.MathUtils.lerp(emp.rightArm.rotation.x, -1.0 + Math.cos(p * 1.15) * 0.14, 0.2);
          emp.leftLeg.rotation.x = THREE.MathUtils.lerp(emp.leftLeg.rotation.x, -1.25, 0.15);
          emp.rightLeg.rotation.x = THREE.MathUtils.lerp(emp.rightLeg.rotation.x, -1.25, 0.15);
          targetBodyY = -0.22;
          emp.headGroup.rotation.y = Math.sin(t * 0.8 + idx) * 0.22;
          emp.root.rotation.y = lerpAngle(emp.root.rotation.y, 0, 0.12);
        } else if (emp.state === 'walking') {
          const target = emp.waypoints[emp.wpIdx];
          const dir = new THREE.Vector3().subVectors(target, emp.root.position);
          dir.y = 0;
          const dist = dir.length();
          if (dist < 0.2) {
            emp.wpIdx++;
            if (emp.wpIdx >= emp.waypoints.length) {
              if (!emp.goingBack) {
                emp.state = 'activity';
              } else {
                emp.state = 'working';
                emp.activityType = 'work';
                emp.activityText = 'Sedang bekerja di meja';
                emp.root.position.copy(emp.seatPos);
                emp.prop.visible = false;
              }
            }
          } else {
            dir.normalize();
            emp.root.position.addScaledVector(dir, 3.1 * dt);
            emp.root.rotation.y = lerpAngle(emp.root.rotation.y, Math.atan2(dir.x, dir.z), 0.14);
            const wp = t * 9.0 + idx;
            emp.leftLeg.rotation.x = Math.sin(wp) * 0.52;
            emp.rightLeg.rotation.x = -Math.sin(wp) * 0.52;
            targetBodyY = Math.abs(Math.sin(wp)) * 0.05; // Natural walking bounce!
            if (emp.prop.visible) {
              emp.leftArm.rotation.x = -0.82; emp.rightArm.rotation.x = -0.82;
            } else {
              emp.leftArm.rotation.x = -Math.sin(wp) * 0.42;
              emp.rightArm.rotation.x = Math.sin(wp) * 0.42;
            }
          }
        } else if (emp.state === 'activity') {
          emp.timer -= dt;
          if (emp.activityType === 'gym') {
            // Energetic treadmill jog + arm pump!
            emp.root.rotation.y = lerpAngle(emp.root.rotation.y, 0, 0.12);
            const jp = t * 12 + idx;
            emp.leftLeg.rotation.x = Math.sin(jp) * 0.62;
            emp.rightLeg.rotation.x = -Math.sin(jp) * 0.62;
            emp.leftArm.rotation.x = -0.8 + Math.cos(jp) * 0.45;
            emp.rightArm.rotation.x = -0.8 - Math.cos(jp) * 0.45;
            targetBodyY = 0.12 + Math.abs(Math.sin(jp)) * 0.08;
          } else if (emp.activityType === 'game') {
            // Sitting on sofa playing console excitedly!
            emp.root.rotation.y = lerpAngle(emp.root.rotation.y, 0, 0.12);
            emp.leftLeg.rotation.x = -1.25; emp.rightLeg.rotation.x = -1.25;
            emp.leftArm.rotation.x = -0.9 + Math.sin(t * 9 + idx) * 0.12;
            emp.rightArm.rotation.x = -0.9 + Math.cos(t * 10 + idx) * 0.12;
            emp.headGroup.rotation.y = Math.sin(t * 2.4 + idx) * 0.25;
            targetBodyY = -0.25;
          } else if (emp.activityType === 'eat' || emp.activityType === 'read') {
            emp.root.rotation.y = lerpAngle(emp.root.rotation.y, 0, 0.12);
            emp.leftLeg.rotation.x = -1.2; emp.rightLeg.rotation.x = -1.2;
            emp.leftArm.rotation.x = -0.85;
            emp.rightArm.rotation.x = emp.activityType === 'eat' ? (-0.95 + Math.sin(t * 3.5) * 0.28) : -0.85;
            targetBodyY = -0.22;
          } else if (emp.activityType === 'sleep') {
            // Lying FACE UP squarely inside their assigned mattress with head resting right ON the pillow!
            emp.root.rotation.y = lerpAngle(emp.root.rotation.y, Math.PI, 0.18);
            emp.leftLeg.rotation.x = 0; emp.rightLeg.rotation.x = 0;
            emp.leftArm.rotation.x = -0.12; emp.rightArm.rotation.x = -0.12;
            emp.headGroup.rotation.y = Math.sin(t * 0.4 + idx) * 0.12;
            targetPivotX = -Math.PI / 2;
            targetBodyY = (emp.sleepBunkY || 0.72) + Math.sin(t * 1.3 + idx) * 0.012;
          } else if (emp.activityType === 'sholat') {
            // Respectful Sholat cycle facing Kiblat (+Z): Standing -> Rukuk -> Sujud
            emp.root.rotation.y = lerpAngle(emp.root.rotation.y, 0, 0.15);
            const cycle = (t * 0.45) % 4;
            if (cycle < 1.3) { // Berdiri / Sedekap
              emp.leftLeg.rotation.x = 0; emp.rightLeg.rotation.x = 0;
              emp.leftArm.rotation.x = -0.75; emp.rightArm.rotation.x = -0.75;
              targetUpperX = 0; targetBodyY = 0;
            } else if (cycle < 2.2) { // Rukuk
              emp.leftLeg.rotation.x = 0; emp.rightLeg.rotation.x = 0;
              emp.leftArm.rotation.x = -0.35; emp.rightArm.rotation.x = -0.35;
              targetUpperX = 1.15; targetBodyY = 0;
            } else { // Sujud / Duduk
              emp.leftLeg.rotation.x = -1.45; emp.rightLeg.rotation.x = -1.45;
              emp.leftArm.rotation.x = -1.1; emp.rightArm.rotation.x = -1.1;
              targetUpperX = 0.95; targetBodyY = -0.42;
            }
          } else {
            // Handing off work deliverable
            emp.leftLeg.rotation.x = 0; emp.rightLeg.rotation.x = 0;
            emp.leftArm.rotation.x = -0.9; emp.rightArm.rotation.x = -0.9;
          }

          if (emp.timer <= 0) {
            emp.goingBack = true;
            emp.prop.visible = false;
            emp.waypoints = emp.returnWaypoints;
            emp.wpIdx = 0;
            emp.state = 'walking';
          }
        }

        emp.upper.rotation.x = THREE.MathUtils.lerp(emp.upper.rotation.x, targetUpperX, 0.12);
        emp.bodyPivot.rotation.x = THREE.MathUtils.lerp(emp.bodyPivot.rotation.x, targetPivotX, 0.12);
        emp.bodyPivot.position.y = THREE.MathUtils.lerp(emp.bodyPivot.position.y, targetBodyY, 0.14);

        // Position clean Name-Divisi tag smoothly above head
        const tp = project(new THREE.Vector3(emp.root.position.x, 2.25 + emp.bodyPivot.position.y, emp.root.position.z));
        emp.tagEl.style.left = tp.x + 'px';
        emp.tagEl.style.top = tp.y + 'px';
        emp.tagEl.style.display = tp.vis ? 'block' : 'none';

        // Position Nadia's broadcast speech bubble cleanly above her name tag
        if (emp.id === 'assistant' && nadiaBubbleEl.classList.contains('show')) {
          const np = project(new THREE.Vector3(emp.root.position.x, 2.75 + emp.bodyPivot.position.y, emp.root.position.z));
          nadiaBubbleEl.style.left = np.x + 'px';
          nadiaBubbleEl.style.top = np.y + 'px';
          nadiaBubbleEl.style.display = np.vis ? 'block' : 'none';
        }
      });

      roomLabels.forEach(rl => {
        const p = project(rl.pos);
        rl.el.style.left = p.x + 'px';
        rl.el.style.top = p.y + 'px';
        rl.el.style.display = p.vis ? 'block' : 'none';
      });

      renderer.render(scene, camera);
    }

    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
  <script src="nadia-chat.js?v=1"></script>
</body>
</html>
